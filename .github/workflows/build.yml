name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # Временно удалите или закомментируйте эту строку:
    # if: ${{ github.event.inputs.build_macos == 'true' }}
    env:
      CFFI_VERSION: "2.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install universal2 Python
        run: |
          set -euo pipefail
          curl -LO https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python-3.12.10-macos11.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3.12 -m pip install --upgrade pip setuptools wheel
          python3.12 -m pip install delocate==0.13.0
          python3.12 -m pip install -r requirements.txt

          mkdir -p wheelhouse/arm64 wheelhouse/x86_64 wheelhouse/universal2

          # Фиксируем одинаковые версии для обеих архитектур
          PYQT_VER="==6.11.0"
          QT_VER="==6.11.2"

          # 1. Скачиваем arm64 версии
          python3.12 -m pip download \
            --only-binary=:all: \
            --platform macosx_11_0_arm64 \
            --python-version 3.12 \
            --implementation cp \
            -d wheelhouse/arm64 \
            "cffi==$CFFI_VERSION" \
            Pillow==12.1.0 \
            psutil==7.0.0 \
            "PyQt6$PYQT_VER" \
            "PyQt6-Qt6$QT_VER" \
            PyQt6-sip

          # 2. Скачиваем x86_64 версии (с теми же версиями пакетов)
          python3.12 -m pip download \
            --only-binary=:all: \
            --platform macosx_10_13_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            -d wheelhouse/x86_64 \
            "cffi==$CFFI_VERSION" \
            Pillow==12.1.0

          python3.12 -m pip download \
            --only-binary=:all: \
            --platform macosx_10_14_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            -d wheelhouse/x86_64 \
            psutil==7.0.0 \
            "PyQt6-Qt6$QT_VER" \
            PyQt6-sip

          # 3. Склеиваем архитектуры в universal2
          delocate-merge wheelhouse/arm64/cffi-*.whl wheelhouse/x86_64/cffi-*.whl -w wheelhouse/universal2
          delocate-merge wheelhouse/arm64/pillow-12.1.0-*.whl wheelhouse/x86_64/pillow-12.1.0-*.whl -w wheelhouse/universal2
          delocate-merge wheelhouse/arm64/psutil-7.0.0-*.whl wheelhouse/x86_64/psutil-7.0.0-*.whl -w wheelhouse/universal2
          delocate-merge wheelhouse/arm64/pyqt6_qt6-*.whl wheelhouse/x86_64/pyqt6_qt6-*.whl -w wheelhouse/universal2
          
          # Проверяем PyQt6-sip на universal2
          if ! ls wheelhouse/arm64/pyqt6_sip-*.whl | grep -q "universal2"; then
            delocate-merge wheelhouse/arm64/pyqt6_sip-*.whl wheelhouse/x86_64/pyqt6_sip-*.whl -w wheelhouse/universal2
          else
            cp wheelhouse/arm64/pyqt6_sip-*.whl wheelhouse/universal2/
          fi

          # Копируем PyQt6 (он изначально скачивается как universal2)
          cp wheelhouse/arm64/pyqt6-*.whl wheelhouse/universal2/

          # 4. Устанавливаем готовые universal2 пакеты
          python3.12 -m pip install --no-deps wheelhouse/universal2/*.whl
          python3.12 -m pip install pycparser
          python3.12 -m pip install pyinstaller==6.13.0

      - name: Validate macOS GUI dependencies
        run: |
          python3.12 -m pip check
          python3.12 -m py_compile main.py
          python3.12 -c "import PyQt6, requests, static_ffmpeg, main"

      - name: Verify macOS icon
        run: test -f "icon.icns"

      - name: Build app with PyInstaller
        run: python3.12 -m PyInstaller packaging/macos.spec --noconfirm

      - name: Validate universal2 app bundle
        run: |
          set -euo pipefail
          ICON_FILE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            'dist/video-flip-fixer.app/Contents/Info.plist')"
          test -n "$ICON_FILE"
          test -f "dist/video-flip-fixer.app/Contents/Resources/$ICON_FILE"
          # Строка проверки customtkinter удалена, так как теперь используется PyQt6

          found=0
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              found=1
              archs="$(lipo -archs "$file" 2>/dev/null || true)"
              case "$archs" in
                *arm64*x86_64*|*x86_64*arm64*) ;;
                *)
                  echo "Missing universal2 slices in $file: ${archs:-unknown}" >&2
                  exit 1
                  ;;
              esac
            fi
          done < <(find "dist/video-flip-fixer.app" -type f -print0)

          if [ "$found" -eq 0 ]; then
            echo "No Mach-O files found in app bundle" >&2
            exit 1
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          
          echo "Создаю DMG образ с помощью hdiutil..."
          
          # 1. Создаем пустой DMG нужного размера, куда поместится ваше приложение
          hdiutil create -megabytes 150 -fs HFS+ -volname "video-flip-fixer" -attach dist/temp.dmg
          
          # 2. Находим, куда примонтировался наш временный DMG
          MOUNT_DIR=$(df | grep "/Volumes/video-flip-fixer" | awk '{print $9}')
          echo "Временный диск примонтирован в: $MOUNT_DIR"
          
          # 3. Копируем собранное приложение .app на этот диск
          cp -R "dist/video-flip-fixer.app" "$MOUNT_DIR/"
          
          # 4. Создаем символическую ссылку на папку Applications (чтобы пользователь мог удобно перетащить приложение)
          ln -s /Applications "$MOUNT_DIR/Applications"
          
          # 5. Размонтируем диск
          hdiutil detach "$MOUNT_DIR"
          
          # 6. Конвертируем DMG в сжатый формат (дистрибутив) для конечных пользователей
          hdiutil convert dist/temp.dmg -format UDZO -o dist/video-flip-fixer_macos_universal.dmg
          
          # 7. Удаляем временный файл
          rm dist/temp.dmg
          
          echo "Готово! Финальный DMG успешно создан в папки dist/."

      - name: Validate DMG
        run: |
          set -euo pipefail
          echo "Проверяю созданный DMG..."
          
          # Простая проверка, что файл физически существует и имеет размер больше 0
          test -f "dist/video-flip-fixer_macos_universal.dmg"
          test -s "dist/video-flip-fixer_macos_universal.dmg"
          
          echo "DMG успешно прошел проверку."

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: video-flip-fixer-macOS
          path: dist/video-flip-fixer_macos_universal.dmg
