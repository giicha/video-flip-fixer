name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # Временно удалите или закомментируйте эту строку:
    # if: ${{ github.event.inputs.build_macos == 'true' }}
    env:
      CFFI_VERSION: "2.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install macOS-compatible Python
        run: |
          set -euo pipefail
          # Заменили -LO на -L -o python-installer.pkg для стабильного сохранения файла
          curl -L https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg -o python-installer.pkg
          sudo installer -pkg python-installer.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3.12 -m pip install --upgrade pip setuptools wheel
          python3.12 -m pip install pyinstaller==6.13.0
          python3.12 -m pip install -r requirements.txt

      # ====================================================================
      # НАДЕЖНЫЙ СКАЧИВАТЕЛЬ И СКЛЕИВАТЕЛЬ UNIVERSAL2 FFMPEG
      # ====================================================================
      - name: Download and Merge Genuine Universal2 FFmpeg
        run: |
          set -euo pipefail
          mkdir -p bin_x86 bin_arm bin
          
          echo "Скачиваю официальные нативные сборки FFmpeg с GitHub Releases..."
          # Качаем Intel (x86_64) версию
          curl -L "https://github.com" -o ffmpeg_intel.zip
          # Качаем ARM64 (Apple Silicon) версию
          curl -L "https://github.com" -o ffmpeg_arm.zip

          echo "Распаковываю архивы..."
          # Распаковываем, флаг -j убирает вложенные папки, складывая бинарники в корень целевой папки
          unzip -q -j ffmpeg_intel.zip -d bin_x86/
          unzip -q -j ffmpeg_arm.zip -d bin_arm/
          
          echo "Склеиваю архитектуры Intel и ARM через lipo в Universal2..."
          lipo -create bin_x86/ffmpeg bin_arm/ffmpeg -output bin/ffmpeg
          lipo -create bin_x86/ffprobe bin_arm/ffprobe -output bin/ffprobe
          
          # Даем права на запуск в macOS
          chmod +x bin/ffmpeg bin/ffprobe
          
          echo "Проверка архитектуры итоговых бинарников (должно быть x86_64 arm64):"
          lipo -archs bin/ffmpeg
          lipo -archs bin/ffprobe
          
          # Очищаем временный мусор на сервере
          rm -rf bin_x86 bin_arm *.zip
          echo "=== Настоящие Universal2 бинарники FFmpeg успешно подготовлены в bin/ ==="

      - name: Validate macOS GUI dependencies
        run: |
          python3.12 -m pip check
          python3.12 -m py_compile main.py

      - name: Verify macOS icon
        run: test -f "icon.icns"

      - name: Build app with PyInstaller
        run: python3.12 -m PyInstaller packaging/macos.spec --noconfirm

      # Жесткая и честная проверка — lipo -archs теперь проверяет ВСЕ файлы без исключения
      - name: Validate universal2 app bundle
        run: |
          set -euo pipefail
          ICON_FILE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            'dist/video-flip-fixer.app/Contents/Info.plist')"
          test -n "$ICON_FILE"
          test -f "dist/video-flip-fixer.app/Contents/Resources/$ICON_FILE"

          found=0
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              found=1
              archs="$(lipo -archs "$file" 2>/dev/null || true)"
              case "$archs" in
                *arm64*x86_64*|*x86_64*arm64*) ;;
                *)
                  echo "CRITICAL ARCH ERROR: Missing universal2 slices in $file: ${archs:-unknown}" >&2
                  exit 1
                  ;;
              esac
            fi
          done < <(find "dist/video-flip-fixer.app" -type f -print0)

          if [ "$found" -eq 0 ]; then
            echo "No Mach-O files found in app bundle" >&2
            exit 1
          fi
          echo "=== УСПЕХ: Все файлы бандла, включая FFmpeg, на 100% Universal2! ==="

      - name: Create DMG
        run: |
          set -euo pipefail
          
          echo "Создаю DMG образ с помощью hdiutil..."
          
          # 1. Создаем пустой DMG увеличенного размера (500 МБ), куда гарантированно поместится тяжелый PyQt6 + FFmpeg
          hdiutil create -megabytes 500 -fs HFS+ -volname "video-flip-fixer" -attach dist/temp.dmg
          
          # 2. Находим, куда примонтировался наш временный DMG
          MOUNT_DIR=$(df | grep "/Volumes/video-flip-fixer" | awk '{print $9}')
          echo "Временный диск примонтирован в: $MOUNT_DIR"
          
          # 3. Копируем собранное приложение .app на этот диск
          cp -R "dist/video-flip-fixer.app" "$MOUNT_DIR/"
          
          # 4. Создаем символическую ссылку на папку Applications для удобства перетаскивания пользователя
          ln -s /Applications "$MOUNT_DIR/Applications"
          
          # 5. Размонтируем диск
          hdiutil detach "$MOUNT_DIR"
          
          # 6. Конвертируем DMG в сжатый формат (дистрибутив), который сожмет пустые мегабайты
          hdiutil convert dist/temp.dmg -format UDZO -o dist/video-flip-fixer_macos_universal.dmg
          
          # 7. Удаляем временный файл
          rm dist/temp.dmg
          
          echo "Готово! Финальный сжатый DMG успешно создан в папке dist/."

      - name: Validate DMG
        run: |
          set -euo pipefail
          echo "Проверяю созданный DMG..."
          
          # Простая проверка, что файл физически существует и имеет размер больше 0
          test -f "dist/video-flip-fixer_macos_universal.dmg"
          test -s "dist/video-flip-fixer_macos_universal.dmg"
          
          echo "DMG успешно прошел проверку."

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: video-flip-fixer-macOS
          path: dist/video-flip-fixer_macos_universal.dmg
