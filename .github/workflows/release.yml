name: Build and Release

on:
  push:
    branches:
      - feat/macos-support

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: "dist/*.exe"
          - os: macos-13  # Использование macos-13 (Intel) обеспечивает максимальную обратную совместимость с Catalina
            artifact_name: "dist/*-macOS.zip"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set macOS Deployment Target
      if: matrix.os == 'macos-13'
      run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests static-ffmpeg pyinstaller

    - name: Build with PyInstaller
      run: |
        python build_release.py

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
