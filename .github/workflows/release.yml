name: Build and Release

on:
  push:
    branches:
      - feat/macos-support # Сборка запускается при пуше в тестовую ветку

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: "video-flip-fixer.exe"
            search_path: "dist/*.exe"
          - os: macos-13
            artifact_name: "video-flip-fixer-macOS.zip"
            search_path: "dist/*-macOS.zip"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set macOS Deployment Target
      if: matrix.os == 'macos-13'
      run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests static-ffmpeg pyinstaller

    - name: Build with PyInstaller
      run: |
        python build_release.py

    # ВМЕСТО РЕЛИЗА: Временно загружаем файлы в артефакты сборки
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.search_path }}
